services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventvivid
      POSTGRES_PASSWORD: eventvivid
      POSTGRES_DB: eventvivid
    ports:
      - "5432:5432"
    volumes:
      - eventvivid_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventvivid"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: eventvivid
      RABBITMQ_DEFAULT_PASS: eventvivid
    ports:
      - "5672:5672"
      - "15672:15672"
volumes:
  eventvivid_pg:
